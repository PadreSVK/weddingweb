<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pre zasvätených" />
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
  <title>Pre zasvätených</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italianno&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />

  <script src="https://unpkg.com/vue@3.4.27/dist/vue.global.prod.js"></script>

  <style>
    [v-cloak] { display: none; }

    body { min-height: 100vh; }

    /* top session bar */
    .ins-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1.5rem;
      background: rgba(243, 238, 226, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--color-cream-deep);
    }
    .ins-bar__who {
      font-weight: 600;
      color: var(--color-stone);
    }
    .btn--sm { padding: 0.5rem 1.1rem; font-size: 0.9rem; }

    /* login / generic card */
    .ins-card {
      max-width: 460px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      background: rgba(255, 253, 248, 0.9);
      padding: 2.5rem 2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
    }

    .ins-error {
      color: var(--rust);
      font-weight: 600;
      margin: 0;
    }

    /* team perks / responsibilities */
    .ins-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .ins-panel {
      background: rgba(255, 253, 248, 0.85);
      border-radius: var(--radius);
      padding: 1.75rem 1.75rem;
      box-shadow: var(--shadow-soft);
    }
    .ins-panel__title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--color-stone);
      margin-bottom: 1rem;
    }
    .ins-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .ins-list li {
      position: relative;
      padding-left: 1.9rem;
      color: var(--color-stone-light);
      font-weight: 500;
    }
    .ins-list--perks li::before { content: '✨'; position: absolute; left: 0; }
    .ins-list--resp  li::before { content: '•'; position: absolute; left: 0.5rem; color: var(--color-terracotta); font-size: 1.4rem; line-height: 1; }

    /* join box */
    .ins-join {
      max-width: 560px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      align-items: center;
    }
    .ins-join__check {
      font-size: 1.1rem;
      color: var(--color-stone);
      text-align: left;
      align-items: flex-start;
    }
    .ins-joined {
      text-align: center;
    }
    .ins-joined__icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .ins-joined p { font-size: 1.2rem; font-weight: 600; color: var(--color-stone); }

    .ins-soon {
      text-align: center;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-style: italic;
      color: var(--color-stone-light);
    }

    /* roles */
    .ins-rolecat { margin-bottom: 2.5rem; }
    .ins-rolecat__head { margin-bottom: 1.25rem; }
    .ins-rolecat__hint {
      color: var(--color-stone-light);
      font-style: italic;
      margin-top: 0.15rem;
    }
    .ins-roles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }
    .ins-role {
      background: rgba(255, 253, 248, 0.85);
      border-radius: var(--radius);
      padding: 1.5rem 1.5rem;
      box-shadow: var(--shadow-soft);
    }
    .ins-role__top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.6rem;
    }
    .ins-role__title {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--color-stone);
    }
    .ins-role__holder {
      flex: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-terracotta);
      background: var(--color-cream-deep);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
    }
    .ins-role__desc {
      color: var(--color-stone-light);
      line-height: 1.6;
    }
    .ins-role__desc--empty { font-style: italic; opacity: 0.75; }
    .ins-role--mine {
      outline: 2px solid var(--color-terracotta);
      outline-offset: 0;
    }
    .ins-role__holder--me {
      color: #fff;
      background: var(--color-terracotta);
    }
    .ins-role__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1rem;
    }
    .ins-createrole {
      margin-top: 2.5rem;
      text-align: center;
    }
    .ins-createrole .ins-card { text-align: left; max-width: 520px; }

    @media (max-width: 640px) {
      .ins-cols { grid-template-columns: 1fr; }
      .ins-roles { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="insiders-app" v-cloak>
    <!-- session bar -->
    <div class="ins-bar" v-if="authed">
      <span class="ins-bar__who">🔑 {{ session.name }}</span>
      <button class="btn btn--ghost btn--sm" @click="logout">Odhlásiť</button>
    </div>

    <!-- content failed to load -->
    <section class="section section--cream" v-if="loadError">
      <div class="container container--narrow">
        <p class="form-hint">Obsah sa nepodarilo načítať. Skús obnoviť stránku, alebo nám napíš.</p>
      </div>
    </section>

    <template v-else-if="cfg">
      <!-- LOGIN -->
      <section class="section section--cream" v-if="!authed">
        <div class="container container--narrow">
          <div class="section__heading">
            <span class="section__eyebrow">{{ cfg.login.eyebrow }}</span>
            <h1 class="section__title">{{ cfg.login.title }}</h1>
            <div class="ornament"></div>
            <p class="section__lead">{{ cfg.login.intro }}</p>
          </div>

          <form class="ins-card" @submit.prevent="submitLogin">
            <label class="form-field">
              <span class="form-label">{{ cfg.login.nameLabel }}</span>
              <input v-model="login.name" type="text" autocomplete="name" required />
            </label>
            <label class="form-field">
              <span class="form-label">{{ cfg.login.keyLabel }}</span>
              <input v-model="login.key" type="text" autocapitalize="characters" spellcheck="false" required placeholder="XXXX-XXXX-XXXX" />
            </label>
            <p class="ins-error" v-if="login.error">{{ login.error }}</p>
            <button type="submit" class="btn btn--primary btn--lg" :disabled="login.busy">
              {{ login.busy ? 'Overujem…' : cfg.login.submit }}
            </button>
          </form>
        </div>
      </section>

      <!-- AUTHENTICATED -->
      <template v-else>
        <section class="section section--cream" id="tim">
          <div class="container container--narrow">
            <div class="section__heading">
              <span class="section__eyebrow">{{ cfg.team.eyebrow }}</span>
              <h1 class="section__title">{{ cfg.team.title }}</h1>
              <div class="ornament"></div>
              <p class="section__lead">{{ cfg.team.intro }}</p>
            </div>

            <div class="ins-cols">
              <div class="ins-panel">
                <h2 class="ins-panel__title">{{ cfg.team.perksTitle }}</h2>
                <ul class="ins-list ins-list--perks">
                  <li v-for="(p, i) in cfg.team.perks" :key="i">{{ p }}</li>
                </ul>
              </div>
              <div class="ins-panel">
                <h2 class="ins-panel__title">{{ cfg.team.responsibilitiesTitle }}</h2>
                <ul class="ins-list ins-list--resp">
                  <li v-for="(r, i) in cfg.team.responsibilities" :key="i">{{ r }}</li>
                </ul>
              </div>
            </div>

            <div class="ins-join">
              <template v-if="!session.joinedTeam">
                <label class="check ins-join__check">
                  <input type="checkbox" v-model="joinChecked" />
                  <span>{{ cfg.team.joinLabel }}</span>
                </label>
                <p class="ins-error" v-if="joinError">{{ joinError }}</p>
                <button class="btn btn--primary btn--lg" :disabled="!joinChecked || joining" @click="joinTeam">
                  {{ joining ? 'Pridávam…' : 'Potvrdiť' }}
                </button>
              </template>
              <div v-else class="ins-joined">
                <div class="ins-joined__icon">🤝</div>
                <p>{{ cfg.team.joinedText }}</p>
              </div>
            </div>
          </div>
        </section>

        <!-- ROLES -->
        <section class="section section--sage" id="role" v-if="cfg.roles">
          <div class="container container--narrow">
            <div class="section__heading">
              <span class="section__eyebrow">{{ cfg.roles.eyebrow }}</span>
              <h1 class="section__title">{{ cfg.roles.title }}</h1>
              <div class="ornament"></div>
              <p class="section__lead">{{ cfg.roles.intro }}</p>
            </div>

            <p class="ins-error" v-if="rolesError">{{ rolesError }}</p>

            <div v-for="(cat, key) in cfg.roles.categories" :key="key" class="ins-rolecat">
              <div class="ins-rolecat__head">
                <h2 class="ins-panel__title">{{ cat.title }}</h2>
                <p class="ins-rolecat__hint">{{ cat.hint }}</p>
              </div>
              <div class="ins-roles">
                <div
                  v-for="role in rolesByCategory(key)"
                  :key="role.id"
                  class="ins-role"
                  :class="{ 'ins-role--mine': role.mine }"
                >
                  <div class="ins-role__top">
                    <h3 class="ins-role__title">{{ role.title }}</h3>
                    <span v-if="role.mine" class="ins-role__holder ins-role__holder--me">Máš ju ty</span>
                    <span v-else-if="role.holderName" class="ins-role__holder">{{ role.holderName }}</span>
                  </div>
                  <p v-if="role.description" class="ins-role__desc">{{ role.description }}</p>
                  <p v-else class="ins-role__desc ins-role__desc--empty">Bez popisu.</p>

                  <div class="ins-role__actions" v-if="role.canClaim || role.canTake || role.canRelease">
                    <button
                      v-if="role.canClaim"
                      class="btn btn--primary btn--sm"
                      :disabled="rolesBusy === role.id"
                      @click="claimRole(role)"
                    >{{ rolesBusy === role.id ? '…' : cfg.roles.claimLabel }}</button>
                    <button
                      v-if="role.canTake"
                      class="btn btn--primary btn--sm"
                      :disabled="rolesBusy === role.id"
                      @click="takeRole(role)"
                    >{{ rolesBusy === role.id ? '…' : cfg.roles.takeLabel }}</button>
                    <button
                      v-if="role.canRelease"
                      class="btn btn--ghost btn--sm"
                      :disabled="rolesBusy === role.id"
                      @click="releaseRole(role)"
                    >{{ rolesBusy === role.id ? '…' : cfg.roles.releaseLabel }}</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- invent your own optional role -->
            <div class="ins-createrole">
              <button v-if="!create.open" class="btn btn--ghost" @click="create.open = true">
                ➕ {{ cfg.roles.createLabel }}
              </button>
              <form v-else class="ins-card" @submit.prevent="createRole">
                <h3 class="ins-panel__title">{{ cfg.roles.createLabel }}</h3>
                <label class="form-field">
                  <span class="form-label">{{ cfg.roles.createTitleLabel }}</span>
                  <input v-model="create.title" type="text" required maxlength="60" />
                </label>
                <label class="form-field">
                  <span class="form-label">{{ cfg.roles.createDescLabel }}</span>
                  <textarea v-model="create.description" rows="3" maxlength="500"></textarea>
                </label>
                <p class="ins-error" v-if="create.error">{{ create.error }}</p>
                <div class="ins-role__actions">
                  <button type="submit" class="btn btn--primary" :disabled="create.busy">
                    {{ create.busy ? 'Vytváram…' : 'Vytvoriť rolu' }}
                  </button>
                  <button type="button" class="btn btn--ghost" :disabled="create.busy" @click="create.open = false">
                    Zrušiť
                  </button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <!-- Ideas arrive in a later phase -->
        <section class="section section--cream">
          <div class="container container--narrow">
            <p class="ins-soon">Čoskoro tu pribudnú aj <strong>nápady</strong>. ✨</p>
          </div>
        </section>
      </template>
    </template>
  </div>

  <script src="js/insiders.js"></script>
</body>
</html>
